<script>

/* =========================================================
   THE WHITE STARTUP SCHOOL
   LOADER SCRIPT
   ========================================================= */

(function () {

    const loader =
        document.getElementById(
            "white-loader"
        );


    const number =
        document.getElementById(
            "whitePercent"
        );


    /* =====================================================
       LOADING DURATION
       ===================================================== */

    const duration = 4200;

    const start =
        performance.now();


    /* =====================================================
       UPDATE PERCENTAGE
       ===================================================== */

    function update(now) {

        const elapsed =
            now - start;


        let progress =
            elapsed / duration;


        progress =
            Math.min(
                progress,
                1
            );


        /* Smooth percentage */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                2
            );


        const value =
            Math.floor(
                eased * 100
            );


        number.textContent =
            value;


        if (progress < 1) {

            requestAnimationFrame(
                update
            );

        } else {

            finish();

        }

    }


    /* =====================================================
       FINISH
       DIRECTLY GO TO HOME
       NO BLACK SCREEN
       ===================================================== */

    function finish() {

        number.textContent =
            "100";


        /*
         * Give the 100% state a very short moment,
         * then fade the loader away.
         */

        setTimeout(function () {

            /* Fade out the complete loader */

            loader.classList.add(
                "exit"
            );


            /*
             * Go directly to home.html.
             *
             * No black transition.
             * No black overlay.
             */

            setTimeout(function () {

                window.location.href =
                    "home.html";

            }, 350);


        }, 200);

    }


    /* =====================================================
       PREVENT SCROLL
       ===================================================== */

    document.body.style.overflow =
        "hidden";


    /* =====================================================
       START
       ===================================================== */

    requestAnimationFrame(
        update
    );


})();

</script>
